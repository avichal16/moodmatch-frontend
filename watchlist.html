<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>MoodMatch — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer src="script.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(124,58,237,.18), transparent 32rem),
        radial-gradient(circle at 85% 8%, rgba(236,72,153,.12), transparent 28rem),
        #070b14;
    }
    h1,h2,h3,.brand { font-family:"Plus Jakarta Sans",Inter,sans-serif; }
    #watchlistContainer > div {
      width: 100% !important;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 1rem;
      background: rgba(15,23,42,.72);
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
      padding-bottom: .9rem;
      transition: transform .25s ease, border-color .25s ease;
    }
    #watchlistContainer > div:hover { transform: translateY(-5px); border-color: rgba(167,139,250,.35); }
    #watchlistContainer img { width:100%; aspect-ratio:2/3; object-fit:cover; margin:0 0 .75rem !important; border-radius:0 !important; background:#111827; }
    #watchlistContainer p { padding:0 .8rem; color:#f8fafc; font-size:.9rem; font-weight:700; line-height:1.3; }
    #watchlistContainer button { margin:.75rem .8rem 0 !important; border-radius:999px !important; background:rgba(255,255,255,.07) !important; color:#fda4af !important; font-size:.75rem; font-weight:700; padding:.5rem .8rem !important; }
  </style>
</head>
<body class="text-slate-100 antialiased">
  <header class="sticky top-0 z-30 border-b border-white/[0.07] bg-[#070b14]/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 md:px-8">
      <a href="index.html" class="flex items-center gap-3">
        <img src="mmlogo.png" alt="MoodMatch logo" class="h-12 w-auto md:h-14" />
        <div class="hidden sm:block">
          <span class="brand block text-lg font-extrabold tracking-tight">MoodMatch</span>
          <span class="block text-[10px] font-medium tracking-[.12em] text-slate-500">DISCOVER · EXPLORE · REMEMBER</span>
        </div>
      </a>
      <nav class="flex items-center gap-2 text-xs text-slate-300 sm:text-sm md:gap-3">
        <a href="index.html" class="rounded-full px-3 py-2 transition hover:bg-white/[0.06] hover:text-white">🏠 <span class="hidden sm:inline">Home</span></a>
        <a href="cinemap.html" class="rounded-full px-3 py-2 transition hover:bg-white/[0.06] hover:text-white">🗺️ <span class="hidden sm:inline">CineMap</span></a>
        <a href="watchlist.html" class="rounded-full bg-white/10 px-3 py-2 font-semibold text-white">📚 <span class="hidden sm:inline">Library</span></a>
      </nav>
      <div id="authSection" class="flex items-center gap-3">
        <button id="loginButton" class="rounded-full border border-white/10 bg-white/[0.06] px-4 py-2 text-sm font-semibold transition hover:bg-white/10">Login</button>
        <button id="logoutButton" class="hidden rounded-full bg-white px-4 py-2 text-sm font-bold text-slate-950 transition hover:bg-slate-200">Logout</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 pb-24 pt-12 md:px-8 md:pt-16">
    <section class="mb-10">
      <p class="text-xs font-bold uppercase tracking-[.22em] text-violet-300">Your personal collection</p>
      <h1 class="mt-3 text-4xl font-extrabold tracking-[-.03em] text-white md:text-6xl">Library</h1>
      <p class="mt-4 max-w-2xl text-slate-400">Everything you saved from MoodMatch, gathered in one place for your next movie night, binge, or reading session.</p>
    </section>
    <div id="watchlistContainer" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"></div>
  </main>

  <footer class="border-t border-white/[0.06] py-8 text-center text-sm text-slate-600">MoodMatch · Discover. Explore. Remember.</footer>
</body>
</html>
