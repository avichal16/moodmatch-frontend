<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070c" />
  <title>CineMap — Explore the language of cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script defer src="cinemap.js?v=6"></script>
  <style>
    :root{color-scheme:dark;--bg:#05070c;--panel:rgba(8,12,20,.86);--line:rgba(255,255,255,.09);--muted:#8490a4}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;color:#edf2f7;background:radial-gradient(circle at 50% -10%,rgba(91,73,170,.18),transparent 38rem),linear-gradient(#05070c,#070a10);overflow:hidden}h1,h2,h3,.brand,.region-title{font-family:"Plus Jakarta Sans",Inter,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(5,7,12,.78);backdrop-filter:blur(18px);position:relative;z-index:40}.brand-wrap{display:flex;align-items:center;gap:10px;color:white;text-decoration:none}.brand-wrap img{height:43px}.brand{font-weight:800}nav{display:flex;gap:8px;font-size:13px}nav a{color:#97a3b6;text-decoration:none;padding:8px 12px;border-radius:999px}nav a:hover{color:white;background:rgba(255,255,255,.05)}nav a.active{color:white;background:rgba(255,255,255,.09)}.app{height:calc(100vh - 68px);position:relative}.map-title{position:absolute;z-index:10;left:30px;top:24px;pointer-events:none}.map-title h1{font-size:34px;letter-spacing:-.04em;margin:0}.map-title p{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#697589;margin:6px 0 0}.search-panel{position:absolute;z-index:25;top:22px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 300px));}.search-wrap{position:relative}.search-shell{display:flex;align-items:center;gap:8px;padding:7px;border-radius:18px;background:rgba(8,12,20,.82);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.3);backdrop-filter:blur(18px)}input{width:100%;background:transparent;border:0;outline:0;color:white;padding:9px 11px;font-size:14px}input::placeholder{color:#606c7d}.tiny-btn{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.055);color:#cbd5e1;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.tiny-btn:hover{background:rgba(255,255,255,.1);color:white}.results{position:absolute;top:58px;left:0;right:0;max-height:430px;overflow:auto;background:#0a101b;border:1px solid var(--line);border-radius:16px;display:none;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:6px}.result{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer}.result:hover{background:rgba(255,255,255,.055)}.result img{width:38px;height:48px;object-fit:cover;border-radius:7px;background:#151c28}.result-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#151c28;font-size:18px}.result strong{display:block;font-size:13px}.result span{display:block;color:#697589;font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.edge{stroke:rgba(154,166,185,.23);stroke-width:1}.edge.influence{stroke:rgba(168,139,250,.46);stroke-width:1.35}.edge-label{fill:#657187;font-size:9px;letter-spacing:.04em}.node{cursor:pointer;transition:opacity .18s}.node-bg{fill:rgba(12,18,29,.88);stroke:rgba(255,255,255,.11);stroke-width:1}.node:hover .node-bg{stroke:rgba(196,181,253,.65);fill:rgba(19,26,42,.95)}.node-title{fill:#f8fafc;font-size:12px;font-weight:700}.node-meta{fill:#7b879a;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em}.node.movie .node-bg{stroke:rgba(139,92,246,.28)}.node.director .node-bg,.node.person .node-bg{stroke:rgba(34,211,238,.28)}.node.actor .node-bg{stroke:rgba(244,114,182,.28)}.node.genre .node-bg{stroke:rgba(245,158,11,.33)}.node.style .node-bg,.node.movement .node-bg{stroke:rgba(129,140,248,.34)}.node.country .node-bg{stroke:rgba(52,211,153,.30)}.node.decade .node-bg{stroke:rgba(251,191,36,.25)}.node.company .node-bg{stroke:rgba(148,163,184,.28)}.region-label{fill:rgba(226,232,240,.72);font-family:"Plus Jakarta Sans";font-size:21px;font-weight:700;letter-spacing:.08em}.region-sub{fill:#4e5969;font-size:9px;letter-spacing:.15em}.atlas-menu{position:absolute;z-index:16;left:28px;bottom:24px;width:220px;padding:14px;background:rgba(8,12,20,.72);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px)}.atlas-menu h3{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#6d788a;margin:0 0 10px}.atlas-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b6c0cf;padding:7px 8px;border-radius:8px;font-size:12px;cursor:pointer}.atlas-menu button:hover{background:rgba(255,255,255,.05);color:white}.drawer{position:absolute;right:18px;top:18px;bottom:18px;width:min(410px,calc(100% - 36px));z-index:30;background:rgba(8,12,20,.93);border:1px solid var(--line);border-radius:22px;padding:18px;overflow:auto;transform:translateX(calc(100% + 30px));transition:transform .24s ease;box-shadow:0 28px 90px rgba(0,0,0,.48);backdrop-filter:blur(22px)}.drawer.open{transform:translateX(0)}.close{float:right;width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:white;font-size:20px;cursor:pointer}.poster{width:104px;aspect-ratio:2/3;border-radius:13px;object-fit:cover;background:#111827}.detail-head{display:flex;gap:14px;margin-top:10px}.detail-head h2{margin:4px 0 6px;font-size:23px}.meta{color:#7d899b;font-size:12px}.overview{color:#b7c0cd;font-size:12px;line-height:1.65;margin-top:15px}.drawer h3{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#697589;margin:20px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#c7d0dc;border-radius:999px;padding:6px 9px;font-size:10px;cursor:pointer}.chips button:hover{color:white;border-color:rgba(196,181,253,.35)}.status{position:absolute;right:24px;bottom:22px;z-index:12;color:#566173;font-size:10px}.error{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:35;padding:14px 18px;border:1px solid rgba(244,63,94,.3);border-radius:14px;background:rgba(40,8,18,.95);color:#fecdd3;display:none}@media(max-width:900px){.map-title{display:none}.search-panel{width:calc(100% - 32px)}.atlas-menu{display:none}}@media(max-width:640px){header{padding:0 12px}.brand{display:none}nav{gap:2px}nav a{padding:7px 9px}.search-shell{flex-wrap:wrap}.search-shell input{flex-basis:100%}.search-panel{top:10px}.drawer{top:10px;bottom:10px;right:10px;width:calc(100% - 20px)}}
  </style>
</head>
<body>
<header><a class="brand-wrap" href="index.html"><img src="mmlogo.png" alt="MoodMatch"><span class="brand">MoodMatch</span></a><nav><a href="index.html">Home</a><a class="active" href="cinemap.html">CineMap</a><a href="watchlist.html">Library</a></nav></header>
<main class="app">
  <div class="map-title"><h1>CineMap</h1><p>Explore how cinema connects</p></div>
  <section class="search-panel"><div class="search-wrap"><div class="search-shell"><input id="movieSearch" placeholder="Search films, directors, actors, movements, studios, countries, decades…" autocomplete="off"><button id="randomButton" class="tiny-btn">Random journey</button><button id="resetButton" class="tiny-btn">Reset view</button></div><div id="searchResults" class="results"></div></div></section>
  <svg id="graph" aria-label="Interactive cinema atlas"><g id="viewport"><g id="regionsLayer"></g><g id="edgesLayer"></g><g id="nodesLayer"></g></g></svg>
  <aside class="atlas-menu"><h3>Explore by</h3><button data-atlas="genre">Genres</button><button data-atlas="movement">Movements</button><button data-atlas="director">Directors</button><button data-atlas="country">World cinema</button><button data-atlas="decade">Decades</button><button data-atlas="style">Themes & styles</button><button data-atlas="company">Studios</button></aside>
  <aside id="drawer" class="drawer"><button id="closeDrawer" class="close" aria-label="Close details">×</button><div id="drawerContent"></div></aside>
  <div id="startupError" class="error"></div><div id="mapStats" class="status">Loading atlas…</div>
</main>
</body>
</html>
