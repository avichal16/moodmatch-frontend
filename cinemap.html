<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#03050a" />
<title>CineMap — Explore the world of cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<script defer src="cinemap.js?v=7"></script>
<script defer src="cinemap-layout-tight.js?v=1"></script>
<style>
:root{color-scheme:dark;--bg:#03050a;--panel:rgba(8,12,22,.94);--line:rgba(255,255,255,.09);--genre:#f4a340;--director:#45d0d5;--actor:#ef5c91;--movement:#b35df2;--style:#7c83ff;--country:#83d66d;--decade:#f0c85a;--company:#61a9f7;--movie:#d89cff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 42%,rgba(67,33,141,.14),transparent 31rem),radial-gradient(circle at 23% 30%,rgba(244,163,64,.05),transparent 28rem),radial-gradient(circle at 80% 28%,rgba(69,208,213,.05),transparent 28rem),#03050a;color:#f3f6fb;overflow:hidden}h1,h2,h3,.brand{font-family:"Plus Jakarta Sans",Inter,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(3,5,10,.9);position:relative;z-index:50}.brand-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}.brand-wrap img{height:40px}.brand{font-weight:800}nav{display:flex;gap:6px;font-size:13px}nav a{padding:8px 12px;color:#8f9caf;text-decoration:none;border-radius:999px}nav a:hover{color:white;background:rgba(255,255,255,.05)}nav a.active{color:white;background:rgba(124,58,237,.18);border:1px solid rgba(196,181,253,.16)}.app{height:calc(100vh - 64px);position:relative}.map-title{position:absolute;left:22px;top:18px;z-index:14;pointer-events:none}.map-title h1{margin:0;font-size:26px;letter-spacing:.28em;background:linear-gradient(90deg,#ffb15a,#ef72ac,#9e7cff,#64d4e2,#9add77);-webkit-background-clip:text;color:transparent}.map-title p{margin:7px 0 0;font-size:9px;letter-spacing:.19em;color:#778397;text-transform:uppercase}.search-panel{position:absolute;z-index:32;left:20px;top:88px;width:230px}.search-shell{display:flex;align-items:center;background:rgba(8,12,22,.88);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:3px 8px;backdrop-filter:blur(16px)}input{width:100%;background:transparent;border:0;outline:0;color:white;padding:10px 7px;font-size:12px}input::placeholder{color:#687486}.results{display:none;position:absolute;top:48px;left:0;width:330px;max-height:390px;overflow:auto;background:#080d17;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;box-shadow:0 22px 55px rgba(0,0,0,.55)}.result{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.result:hover{background:rgba(255,255,255,.05)}.result img{width:34px;height:44px;object-fit:cover;border-radius:6px}.result-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#121927}.result strong{display:block;font-size:12px}.result span{display:block;font-size:9px;color:#768296;margin-top:2px;text-transform:uppercase;letter-spacing:.07em}.explore-menu{position:absolute;z-index:20;left:14px;top:160px;width:245px;padding:12px 9px 14px;background:linear-gradient(180deg,rgba(7,10,18,.86),rgba(7,10,18,.62));border:1px solid rgba(255,255,255,.07);border-radius:16px;backdrop-filter:blur(16px)}.explore-menu h3{font-size:9px;letter-spacing:.18em;color:#717d90;margin:0 9px 8px;text-transform:uppercase}.explore-menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:#aeb8c7;padding:8px 9px;border-radius:9px;text-align:left;cursor:pointer;font-size:11px}.explore-menu button:hover{color:white;background:rgba(255,255,255,.045)}.explore-menu .active{color:#caa9ff;background:rgba(124,58,237,.13)}.menu-dot{width:7px;height:7px;border-radius:999px;box-shadow:0 0 12px currentColor}.menu-actions{border-top:1px solid rgba(255,255,255,.06);margin-top:8px;padding-top:8px}.map-help{position:absolute;left:23px;bottom:18px;z-index:15;color:#6d788a;font-size:9px;line-height:1.8}.map-help span{display:block}#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.region-halo{fill:none;stroke-width:1.1;opacity:.35;filter:drop-shadow(0 0 12px currentColor)}.region-label{font-family:"Plus Jakarta Sans";font-weight:700;font-size:15px;letter-spacing:.08em}.region-sub{font-size:7px;letter-spacing:.14em;fill:#586376}.node{cursor:pointer;transition:opacity .2s}.node text{transition:opacity .2s,filter .2s}.node-title{font-size:10.5px;font-weight:500;paint-order:stroke;stroke:#03050a;stroke-width:3.5px}.node-meta{font-size:7px;fill:#758196;letter-spacing:.07em;paint-order:stroke;stroke:#03050a;stroke-width:3px}.node.seed .node-title{font-size:9.5px}.node.movie .node-title{fill:var(--movie)}.node.director .node-title,.node.person .node-title{fill:var(--director)}.node.actor .node-title{fill:var(--actor)}.node.genre .node-title{fill:var(--genre)}.node.movement .node-title{fill:var(--movement)}.node.style .node-title{fill:var(--style)}.node.country .node-title{fill:var(--country)}.node.decade .node-title{fill:var(--decade)}.node.company .node-title{fill:var(--company)}.node:hover .node-title{filter:drop-shadow(0 0 6px currentColor);font-weight:700}.node.focused .node-title{font-size:16px;font-weight:800;filter:drop-shadow(0 0 10px currentColor)}.node.focused .node-meta{font-size:8px;fill:#c9d0dc}.node.dimmed{opacity:.13}.edge{fill:none;stroke:rgba(153,166,185,.24);stroke-width:1}.edge-label{font-size:7px;fill:#667287;paint-order:stroke;stroke:#03050a;stroke-width:3px}.edge.active{stroke-width:1.5;opacity:.95;filter:drop-shadow(0 0 4px currentColor)}.edge.dimmed{opacity:.06}.drawer{position:absolute;z-index:35;right:16px;top:16px;bottom:16px;width:min(360px,calc(100% - 32px));padding:17px;background:rgba(8,12,22,.96);border:1px solid rgba(196,181,253,.14);border-radius:18px;overflow:auto;transform:translateX(calc(100% + 24px));transition:transform .24s ease;box-shadow:0 28px 80px rgba(0,0,0,.5);backdrop-filter:blur(22px)}.drawer.open{transform:translateX(0)}.close{float:right;width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.06);color:white;font-size:19px;cursor:pointer}.poster{width:100px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:#111827}.detail-head{display:flex;gap:13px;margin-top:8px}.detail-head h2{font-size:21px;margin:4px 0 6px}.meta{font-size:11px;color:#8894a6}.overview{font-size:11px;line-height:1.65;color:#b8c1cf;margin-top:14px}.drawer h3{font-size:9px;letter-spacing:.16em;color:#788497;text-transform:uppercase;margin:18px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{border:0;background:transparent;color:#b9c3d1;padding:4px 2px;font-size:10px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.12);text-underline-offset:3px}.chips button:hover{color:white}.legend{position:absolute;z-index:15;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:17px;align-items:center;font-size:9px;color:#8490a3}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:7px;height:7px;border-radius:50%;display:block}.status{position:absolute;right:18px;bottom:15px;z-index:14;color:#596477;font-size:8px}.error{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:45;background:#260a14;border:1px solid rgba(244,63,94,.35);color:#fecdd3;padding:12px 16px;border-radius:12px;display:none;font-size:11px}@media(max-width:920px){.explore-menu,.map-help,.map-title{display:none}.search-panel{left:12px;right:12px;top:10px;width:auto}.legend{display:none}.drawer{right:8px;top:8px;bottom:8px}}@media(max-width:640px){header{padding:0 10px}.brand{display:none}nav a{padding:7px 8px}}
</style>
</head>
<body>
<header><a class="brand-wrap" href="index.html"><img src="mmlogo.png" alt="MoodMatch"><span class="brand">MoodMatch</span></a><nav><a href="index.html">Home</a><a class="active" href="cinemap.html">CineMap</a><a href="watchlist.html">Library</a></nav></header>
<main class="app">
<div class="map-title"><h1>CINEMAP</h1><p>Explore the world of cinema</p></div>
<section class="search-panel"><div class="search-shell"><input id="movieSearch" placeholder="Search anything in cinema…" autocomplete="off"></div><div id="searchResults" class="results"></div></section>
<aside class="explore-menu"><h3>Explore by</h3><button class="active" data-atlas="influence"><span class="menu-dot" style="color:#b35df2;background:#b35df2"></span>Influence & kinship</button><button data-atlas="genre"><span class="menu-dot" style="color:#f4a340;background:#f4a340"></span>Genres</button><button data-atlas="movement"><span class="menu-dot" style="color:#b35df2;background:#b35df2"></span>Movements</button><button data-atlas="director"><span class="menu-dot" style="color:#45d0d5;background:#45d0d5"></span>Directors & filmmakers</button><button data-atlas="country"><span class="menu-dot" style="color:#83d66d;background:#83d66d"></span>World cinema</button><button data-atlas="decade"><span class="menu-dot" style="color:#f0c85a;background:#f0c85a"></span>Decades</button><button data-atlas="style"><span class="menu-dot" style="color:#7c83ff;background:#7c83ff"></span>Themes & styles</button><button data-atlas="company"><span class="menu-dot" style="color:#61a9f7;background:#61a9f7"></span>Studios</button><div class="menu-actions"><button id="randomButton">↝ Random journey</button><button id="resetButton">↻ Reset view</button></div></aside>
<div class="map-help"><span>Drag to pan</span><span>Scroll to zoom</span><span>Click text to explore</span></div>
<svg id="graph" aria-label="Interactive cinema atlas"><g id="viewport"><g id="regionsLayer"></g><g id="edgesLayer"></g><g id="nodesLayer"></g></g></svg>
<aside id="drawer" class="drawer"><button id="closeDrawer" class="close" aria-label="Close details">×</button><div id="drawerContent"></div></aside>
<div class="legend"><span><i style="background:var(--genre)"></i>Genres</span><span><i style="background:var(--director)"></i>Directors</span><span><i style="background:var(--actor)"></i>Actors</span><span><i style="background:var(--movement)"></i>Movements</span><span><i style="background:var(--style)"></i>Themes</span><span><i style="background:var(--country)"></i>Countries</span><span><i style="background:var(--decade)"></i>Decades</span><span><i style="background:var(--company)"></i>Studios</span></div>
<div id="startupError" class="error"></div><div id="mapStats" class="status">Loading atlas…</div>
</main>
</body>
</html>
