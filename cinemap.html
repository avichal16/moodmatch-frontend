  <style>
    :root{color-scheme:dark;--bg:#05070c;--panel:rgba(8,12,20,.86);--line:rgba(255,255,255,.09);--muted:#8490a4}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;color:#edf2f7;background:radial-gradient(circle at 18% 18%,rgba(245,158,11,.08),transparent 26rem),radial-gradient(circle at 52% 8%,rgba(139,92,246,.14),transparent 34rem),radial-gradient(circle at 82% 30%,rgba(16,185,129,.09),transparent 30rem),linear-gradient(#05070c,#070a10);overflow:hidden}h1,h2,h3,.brand,.region-title{font-family:"Plus Jakarta Sans",Inter,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(5,7,12,.78);backdrop-filter:blur(18px);position:relative;z-index:40}.brand-wrap{display:flex;align-items:center;gap:10px;color:white;text-decoration:none}.brand-wrap img{height:43px}.brand{font-weight:800}nav{display:flex;gap:8px;font-size:13px}nav a{color:#97a3b6;text-decoration:none;padding:8px 12px;border-radius:999px}nav a:hover{color:white;background:rgba(255,255,255,.05)}nav a.active{color:white;background:linear-gradient(135deg,rgba(124,58,237,.36),rgba(219,39,119,.22));border:1px solid rgba(196,181,253,.16)}.app{height:calc(100vh - 68px);position:relative}.map-title{position:absolute;z-index:10;left:30px;top:24px;pointer-events:none}.map-title h1{font-size:34px;letter-spacing:-.04em;margin:0}.map-title p{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8794a8;margin:6px 0 0}.search-panel{position:absolute;z-index:25;top:22px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 300px));}.search-wrap{position:relative}.search-shell{display:flex;align-items:center;gap:8px;padding:7px;border-radius:18px;background:rgba(11,17,29,.9);border:1px solid rgba(167,139,250,.18);box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 40px rgba(124,58,237,.08);backdrop-filter:blur(18px)}input{width:100%;background:transparent;border:0;outline:0;color:white;padding:9px 11px;font-size:14px}input::placeholder{color:#7d899b}.tiny-btn{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:#d6deea;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.tiny-btn:hover{background:rgba(124,58,237,.22);border-color:rgba(167,139,250,.3);color:white}.results{position:absolute;top:58px;left:0;right:0;max-height:430px;overflow:auto;background:#0a101b;border:1px solid rgba(167,139,250,.2);border-radius:16px;display:none;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:6px}.result{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer}.result:hover{background:rgba(124,58,237,.13)}.result img{width:38px;height:48px;object-fit:cover;border-radius:7px;background:#151c28}.result-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,rgba(124,58,237,.24),rgba(14,165,233,.16));font-size:18px}.result strong{display:block;font-size:13px}.result span{display:block;color:#7f8ba0;font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.edge{stroke:rgba(154,166,185,.29);stroke-width:1.05}.edge.influence{stroke:rgba(196,181,253,.62);stroke-width:1.45}.edge-label{fill:#7b879c;font-size:9px;letter-spacing:.04em}.node{cursor:pointer;transition:opacity .18s}.node-bg{fill:rgba(18,26,42,.94);stroke:rgba(255,255,255,.14);stroke-width:1.15;filter:drop-shadow(0 7px 14px rgba(0,0,0,.24))}.node:hover .node-bg{stroke:rgba(255,255,255,.6);filter:drop-shadow(0 9px 22px rgba(0,0,0,.38));}.node-title{fill:#fff;font-size:12px;font-weight:700}.node-meta{fill:#c5cfdd;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em}.node.movie .node-bg{fill:rgba(91,33,182,.58);stroke:rgba(196,181,253,.72)}.node.movie:hover .node-bg{fill:rgba(109,40,217,.74)}.node.director .node-bg,.node.person .node-bg{fill:rgba(8,145,178,.42);stroke:rgba(103,232,249,.66)}.node.director:hover .node-bg,.node.person:hover .node-bg{fill:rgba(8,145,178,.6)}.node.actor .node-bg{fill:rgba(190,24,93,.42);stroke:rgba(249,168,212,.68)}.node.actor:hover .node-bg{fill:rgba(190,24,93,.6)}.node.genre .node-bg{fill:rgba(180,83,9,.5);stroke:rgba(253,186,116,.72)}.node.genre:hover .node-bg{fill:rgba(217,119,6,.64)}.node.style .node-bg{fill:rgba(67,56,202,.5);stroke:rgba(165,180,252,.72)}.node.style:hover .node-bg{fill:rgba(79,70,229,.65)}.node.movement .node-bg{fill:rgba(109,40,217,.5);stroke:rgba(216,180,254,.72)}.node.movement:hover .node-bg{fill:rgba(126,34,206,.66)}.node.country .node-bg{fill:rgba(5,150,105,.46);stroke:rgba(110,231,183,.72)}.node.country:hover .node-bg{fill:rgba(5,150,105,.62)}.node.decade .node-bg{fill:rgba(161,98,7,.5);stroke:rgba(253,224,71,.7)}.node.decade:hover .node-bg{fill:rgba(202,138,4,.62)}.node.company .node-bg{fill:rgba(51,65,85,.82);stroke:rgba(203,213,225,.58)}.node.company:hover .node-bg{fill:rgba(71,85,105,.94)}.region-label{fill:#f8fafc;font-family:"Plus Jakarta Sans";font-size:22px;font-weight:800;letter-spacing:.08em;paint-order:stroke;stroke:rgba(5,7,12,.85);stroke-width:5px}.region-sub{fill:#8e9aab;font-size:9px;letter-spacing:.15em}.atlas-menu{position:absolute;z-index:16;left:28px;bottom:24px;width:230px;padding:14px;background:rgba(10,15,26,.82);border:1px solid rgba(255,255,255,.11);border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(0,0,0,.24)}.atlas-menu h3{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#8995a8;margin:0 0 10px}.atlas-menu button{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#d0d8e4;padding:8px 9px;border-radius:9px;font-size:12px;cursor:pointer}.atlas-menu button:nth-of-type(1):hover{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.22)}.atlas-menu button:nth-of-type(2):hover{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.22)}.atlas-menu button:nth-of-type(3):hover{background:rgba(6,182,212,.16);border-color:rgba(6,182,212,.22)}.atlas-menu button:nth-of-type(4):hover{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.22)}.atlas-menu button:nth-of-type(5):hover{background:rgba(234,179,8,.16);border-color:rgba(234,179,8,.22)}.atlas-menu button:nth-of-type(6):hover{background:rgba(99,102,241,.16);border-color:rgba(99,102,241,.22)}.atlas-menu button:nth-of-type(7):hover{background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.2)}.drawer{position:absolute;right:18px;top:18px;bottom:18px;width:min(410px,calc(100% - 36px));z-index:30;background:rgba(10,15,26,.96);border:1px solid rgba(167,139,250,.16);border-radius:22px;padding:18px;overflow:auto;transform:translateX(calc(100% + 30px));transition:transform .24s ease;box-shadow:0 28px 90px rgba(0,0,0,.48);backdrop-filter:blur(22px)}.drawer.open{transform:translateX(0)}.close{float:right;width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:white;font-size:20px;cursor:pointer}.poster{width:104px;aspect-ratio:2/3;border-radius:13px;object-fit:cover;background:#111827}.detail-head{display:flex;gap:14px;margin-top:10px}.detail-head h2{margin:4px 0 6px;font-size:23px}.meta{color:#8c98ab;font-size:12px}.overview{color:#c6cfdb;font-size:12px;line-height:1.65;margin-top:15px}.drawer h3{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8b97aa;margin:20px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid rgba(167,139,250,.2);background:rgba(124,58,237,.11);color:#d7d0ff;border-radius:999px;padding:6px 9px;font-size:10px;cursor:pointer}.chips button:hover{color:white;background:rgba(124,58,237,.22);border-color:rgba(196,181,253,.38)}.status{position:absolute;right:24px;bottom:22px;z-index:12;color:#728095;font-size:10px}.catalog-note{position:absolute;right:24px;top:24px;z-index:12;color:#758296;font-size:10px;letter-spacing:.04em}.error{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:35;padding:14px 18px;border:1px solid rgba(244,63,94,.3);border-radius:14px;background:rgba(40,8,18,.95);color:#fecdd3;display:none}@media(max-width:900px){.map-title{display:none}.search-panel{width:calc(100% - 32px)}.atlas-menu{display:none}.catalog-note{display:none}}@media(max-width:640px){header{padding:0 12px}.brand{display:none}nav{gap:2px}nav a{padding:7px 9px}.search-shell{flex-wrap:wrap}.search-shell input{flex-basis:100%}.search-panel{top:10px}.drawer{top:10px;bottom:10px;right:10px;width:calc(100% - 20px)}}

</head>
<body>
<header><a class="brand-wrap" href="index.html"><img src="mmlogo.png" alt="MoodMatch"><span class="brand">MoodMatch</span></a><nav><a href="index.html">Home</a><a class="active" href="cinemap.html">CineMap</a><a href="watchlist.html">Library</a></nav></header>
<main class="app">
  <div class="map-title"><h1>CineMap</h1><p>Explore how cinema connects</p></div>
  <section class="search-panel"><div class="search-wrap"><div class="search-shell"><input id="movieSearch" placeholder="Search films, directors, actors, movements, studios, countries, decades…" autocomplete="off"><button id="randomButton" class="tiny-btn">Random journey</button><button id="resetButton" class="tiny-btn">Reset view</button></div><div id="searchResults" class="results"></div></div></section>
  <div class="catalog-note">Starter regions are only entry points · search explores the live catalog</div>
  <svg id="graph" aria-label="Interactive cinema atlas"><g id="viewport"><g id="regionsLayer"></g><g id="edgesLayer"></g><g id="nodesLayer"></g></g></svg>
  <aside class="atlas-menu"><h3>Explore by</h3><button data-atlas="genre">Genres</button><button data-atlas="movement">Movements</button><button data-atlas="director">Directors & filmmakers</button><button data-atlas="country">World cinema</button><button data-atlas="decade">Decades</button><button data-atlas="style">Themes & styles</button><button data-atlas="company">Studios</button></aside>
  <aside id="drawer" class="drawer"><button id="closeDrawer" class="close" aria-label="Close details">×</button><div id="drawerContent"></div></aside>
  <div id="startupError" class="error"></div><div id="mapStats" class="status">Loading atlas…</div>
</main>
